@if (this.bible) {
  <div class="input-container">
    <h2>Recitation</h2>
    <div class="subtitle">
      <p>
        Test your recitation accuracy. Type or dictate scripture below and
        your attempt will compared to the actual text, stored, and counted
        towards any goals.
      </p>
    </div>
    <div class="toolbar">
      <div class="verse-selector-container">
        <button mat-fab extended color="primary" (click)="openPassageSelect()">
          <mat-icon>menu_book</mat-icon> {{ passage ? passage.toString() : 'Auto-detecting' }}
        </button>
      </div>
    </div>
    <div #inputParent class="input-height-container">
      <mat-form-field class="flex-grow">
        <mat-label>Scripture here</mat-label>
        <textarea
          autofocus
          #input
          [(ngModel)]="attempt"
          (input)="this.onInput($event)"
          matInput
          placeholder="In the beginning, God..."
          (keydown)="this.onKeyDown($event)"
          (ngModelChange)="this.adjustInputHeight()"
        ></textarea>
      </mat-form-field>
    </div>
    <div class="button-container">
      <button
        (click)="submit()"
        [disabled]="!valid()"
        mat-flat-button
        color="primary"
      >
        Submit
      </button>
    </div>
  </div>
} @else {
  <div class="page-loader">
    <mat-spinner></mat-spinner>
  </div>
}
